<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Claude Academy — Claude 101 course completion badge, presented to Oren, issued September 3, 2026">
  <defs>
    <path id="arc" d="M 335 400 A 265 265 0 0 1 865 400" fill="none"/>
  </defs>

  <!-- terracotta ground -->
  <rect width="1200" height="800" fill="#BD7256"/>

  <!-- cream decagon -->
  <polygon points="600,30 819,100 954,286 954,514 819,700 600,772 381,700 246,514 246,286 381,100"
           fill="#E7D6C6"/>

  <!-- arced heading -->
  <text font-family="'Raleway', Arial, sans-serif" font-size="27" font-weight="600"
        letter-spacing="7.5" fill="#B4674B">
    <textPath href="#arc" startOffset="50%" text-anchor="middle">COURSE COMPLETION BADGE</textPath>
  </text>

  <!-- two overlapping speech bubbles -->
  <g transform="translate(600 236)" fill="none" stroke="#1A1A17" stroke-width="3.4" stroke-linejoin="round">
    <path d="M-46 -40 h44 a20 20 0 0 1 20 20 v30 a20 20 0 0 1 -20 20 h-24 l-20 20 v-20 a20 20 0 0 1 -20 -20 v-30 a20 20 0 0 1 20 -20 z"/>
    <path d="M2 -18 h44 a20 20 0 0 1 20 20 v30 a20 20 0 0 1 -20 20 v20 l-20 -20 h-24 a20 20 0 0 1 -20 -20 v-30 a20 20 0 0 1 20 -20 z"
          fill="#CC7C5A" fill-opacity="0.85"/>
  </g>

  <!-- title -->
  <text x="600" y="470" font-family="'Lora', Georgia, serif" font-size="118" font-weight="600"
        fill="#1A1A17" text-anchor="middle">Claude 101</text>

  <!-- presentee -->
  <text x="600" y="560" font-family="'Lora', Georgia, serif" font-size="30" fill="#2A2622"
        text-anchor="middle">Presented to</text>
  <text x="600" y="606" font-family="'Lora', Georgia, serif" font-size="36" font-weight="600"
        fill="#1A1A17" text-anchor="middle">Oren</text>

  <!-- footer: brand -->
  <g transform="translate(60 742)" fill="#F4EDE4">
    <g transform="translate(0 -9)" stroke="#F4EDE4" stroke-width="3.2" stroke-linecap="round">
      <line x1="12" y1="0" x2="12" y2="24"/>
      <line x1="0" y1="12" x2="24" y2="12"/>
      <line x1="3.5" y1="3.5" x2="20.5" y2="20.5"/>
      <line x1="20.5" y1="3.5" x2="3.5" y2="20.5"/>
    </g>
    <text x="42" y="12" font-family="'Lora', Georgia, serif" font-size="34" font-weight="600">Claude Academy</text>
  </g>

  <!-- footer: issued -->
  <text x="1140" y="748" font-family="'Raleway', Arial, sans-serif" font-size="20" font-weight="700"
        letter-spacing="1.5" fill="#F4EDE4" text-anchor="end">ISSUED SEPTEMBER 3, 2026</text>
</svg>
