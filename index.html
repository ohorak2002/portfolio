<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oren Horak — Portfolio</title>
<meta name="description" content="Student and builder. A little about who I am, what I've made, what I'm reading, and how to reach me.">
<meta name="color-scheme" content="light dark">

<meta property="og:type" content="website">
<meta property="og:title" content="Oren Horak — Portfolio">
<meta property="og:description" content="Student and builder. Small, careful things for the web.">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%23F2F7F0'/><g fill='none' stroke='%232F4A20' stroke-width='1.6' stroke-linecap='round'><path d='M12 20V7'/><path d='M12 13c0-3.3 2.7-6 6-6 0 3.3-2.7 6-6 6z'/><path d='M12 16c0-2.2-1.8-4-4-4 0 2.2 1.8 4 4 4z'/></g></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/reset.css">
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<a class="skip" href="#main">Skip to content</a>

<!-- ══════════════ NAV — one slim bar, nothing else ══════════════ -->
<header class="nav" id="nav">
  <div class="nav__inner">
    <a class="nav__mark" href="#top">
      <span class="nav__leaf" id="navLeaf" aria-hidden="true"></span>
      <span class="nav__name"></span>
    </a>

    <nav class="nav__links" aria-label="Page sections">
      <a href="#about">About</a>
      <a href="#work">Work</a>
      <a href="#journey">Journey</a>
      <a href="#reading">Reading</a>
      <a href="#contact">Contact</a>
    </nav>

    <button class="nav__theme" id="themeToggle" aria-label="Switch to dark mode" title="Switch theme">
      <svg class="ico-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/>
      </svg>
      <svg class="ico-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20 14.2A8.2 8.2 0 0 1 9.8 4a8.4 8.4 0 1 0 10.2 10.2z"/>
      </svg>
    </button>
  </div>
</header>

<main id="main">

<!-- ══════════════ HERO ══════════════ -->
<section class="hero" id="top">
  <span class="hero__frond hero__frond--l" aria-hidden="true"></span>
  <span class="hero__frond hero__frond--r" aria-hidden="true"></span>

  <div class="wrap hero__inner">
    <div class="portrait" data-rise>
      <div class="portrait__ring" aria-hidden="true"></div>
      <div class="portrait__media" id="portrait"></div>
    </div>

    <p class="hero__greeting" data-rise></p>
    <h1 class="hero__name" data-rise></h1>
    <p class="hero__role" data-rise></p>
    <p class="hero__tagline" data-rise></p>
    <p class="hero__blurb" data-rise></p>

    <div class="hero__actions" data-rise>
      <a class="btn btn--solid" href="#work">See my work</a>
      <a class="btn btn--quiet" href="#contact">Get in touch</a>
    </div>
  </div>

  <a class="hero__down" href="#about" aria-label="Scroll to About">
    <span class="hero__down-line" aria-hidden="true"></span>
  </a>
</section>

<div class="divider" aria-hidden="true"></div>

<!-- ══════════════ ABOUT ══════════════ -->
<section class="band" id="about">
  <div class="wrap">
    <header class="head" data-rise>
      <p class="kicker"></p>
      <h2 class="head__title"></h2>
    </header>

    <div class="about">
      <div class="about__prose" data-rise></div>
      <ul class="facts" data-rise></ul>
    </div>
  </div>
</section>

<!-- ══════════════ WHAT I BELIEVE ══════════════ -->
<section class="band band--tint" id="mission">
  <div class="wrap">
    <header class="head head--center" data-rise>
      <p class="kicker"></p>
      <h2 class="head__title"></h2>
    </header>

    <blockquote class="statement" data-rise></blockquote>
    <ul class="values"></ul>
  </div>
</section>

<div class="divider" aria-hidden="true"></div>

<!-- ══════════════ NOW ══════════════ -->
<section class="band" id="now">
  <div class="wrap">
    <header class="head" data-rise>
      <p class="kicker"></p>
      <h2 class="head__title"></h2>
      <p class="head__note"></p>
    </header>
    <ul class="now"></ul>
  </div>
</section>

<!-- ══════════════ WORK ══════════════ -->
<section class="band band--tint" id="work">
  <div class="wrap">
    <header class="head" data-rise>
      <p class="kicker"></p>
      <h2 class="head__title"></h2>
    </header>
    <ol class="work"></ol>
  </div>
</section>

<div class="divider" aria-hidden="true"></div>

<!-- ══════════════ JOURNEY ══════════════ -->
<section class="band" id="journey">
  <div class="wrap">
    <header class="head" data-rise>
      <p class="kicker"></p>
      <h2 class="head__title"></h2>
    </header>

    <ol class="path"></ol>
    <div class="skills"></div>
  </div>
</section>

<!-- ══════════════ EXTRACURRICULARS ══════════════ -->
<section class="band band--tint" id="extras">
  <div class="wrap">
    <header class="head" data-rise>
      <p class="kicker"></p>
      <h2 class="head__title"></h2>
    </header>
    <ul class="extras"></ul>
  </div>
</section>

<div class="divider" aria-hidden="true"></div>

<!-- ══════════════ READING ══════════════ -->
<section class="band" id="reading">
  <div class="wrap">
    <header class="head" data-rise>
      <p class="kicker"></p>
      <h2 class="head__title"></h2>
      <p class="head__note"></p>
    </header>
    <ul class="shelf"></ul>
  </div>
</section>

<!-- ══════════════ INTERESTS ══════════════ -->
<section class="band band--tint" id="interests">
  <div class="wrap">
    <header class="head" data-rise>
      <p class="kicker"></p>
      <h2 class="head__title"></h2>
    </header>
    <ul class="interests"></ul>
  </div>
</section>

<!-- ══════════════ CONTACT ══════════════ -->
<section class="band band--close" id="contact">
  <span class="horizon" aria-hidden="true"></span>
  <div class="wrap contact">
    <p class="kicker" data-rise></p>
    <h2 class="contact__headline" data-rise></h2>
    <p class="contact__body" data-rise></p>

    <a class="btn btn--solid btn--big" id="mailBtn" href="#" data-rise></a>

    <button class="contact__copy" id="copyMail" data-rise>
      <span>or copy </span><code></code>
    </button>

    <ul class="contact__links" data-rise></ul>
  </div>
</section>

</main>

<footer class="footer">
  <div class="wrap footer__inner">
    <span>© <span id="year"></span> <span id="footerName"></span></span>
    <span>Grown by hand. <a href="#top">Back to top</a></span>
  </div>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/data.js"></script>
<script src="js/botanical.js"></script>
<script src="js/render.js"></script>
<script src="js/scroll.js"></script>
</body>
</html>
