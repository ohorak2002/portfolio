<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="citrus">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oren Horak — Portfolio</title>
<meta name="description" content="Student, builder, and perpetual work-in-progress. Selected work, résumé, and what I'm building right now.">
<meta name="color-scheme" content="dark light">

<!-- Open Graph / social preview -->
<meta property="og:type" content="website">
<meta property="og:title" content="Oren Horak — Portfolio">
<meta property="og:description" content="Student, builder, and perpetual work-in-progress.">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230b0b0f'/><text y='68' x='50' text-anchor='middle' font-size='52' font-family='monospace' fill='%23e8ff5a'>OH</text></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/reset.css">
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- Film grain + vignette overlays (pure CSS, pointer-events none) -->
<div class="grain" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>

<!-- Custom cursor (hidden on touch devices) -->
<div class="cursor" aria-hidden="true"><span class="cursor__dot"></span><span class="cursor__ring"></span></div>

<!-- Scroll progress bar -->
<div class="progress" aria-hidden="true"><span class="progress__bar"></span></div>

<a class="skip" href="#main">Skip to content</a>

<!-- ═══════════════════════ NAV ═══════════════════════ -->
<header class="nav" id="nav">
  <a class="nav__mark" href="#top" data-magnetic>
    <span class="nav__initials" data-scramble-hover>OH</span>
  </a>

  <nav class="nav__links" aria-label="Sections">
    <a href="#mission">Mission</a>
    <a href="#now">Now</a>
    <a href="#work">Work</a>
    <a href="#resume">Résumé</a>
    <a href="#interests">Interests</a>
    <a href="#contact">Contact</a>
  </nav>

  <div class="nav__tools">
    <button class="kbd-hint" id="openPalette" aria-label="Open command palette">
      <span class="kbd-hint__text">Search</span>
      <kbd>⌘</kbd><kbd>K</kbd>
    </button>
    <button class="icon-btn" id="themeToggle" aria-label="Toggle light and dark mode" title="Theme">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/>
      </svg>
    </button>
    <button class="icon-btn" id="accentToggle" aria-label="Change accent colour" title="Accent">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"/>
      </svg>
    </button>
  </div>
</header>

<!-- Right-hand section rail -->
<aside class="rail" aria-hidden="true">
  <ul class="rail__list"></ul>
</aside>

<main id="main">

<!-- ═══════════════════════ HERO ═══════════════════════ -->
<section class="hero" id="top">
  <canvas class="hero__canvas" aria-hidden="true"></canvas>

  <div class="hero__inner">
    <p class="hero__eyebrow" data-reveal></p>

    <h1 class="hero__headline" data-reveal></h1>

    <div class="hero__rotator" data-reveal>
      <span class="hero__rotator-label">Mostly</span>
      <span class="hero__rotator-word" id="rotatorWord"></span>
      <span class="hero__caret" aria-hidden="true"></span>
    </div>

    <p class="hero__blurb" data-reveal></p>

    <div class="hero__status" data-reveal>
      <span class="dot"></span>
      <span class="hero__status-label"></span>
      <strong class="hero__status-value"></strong>
    </div>

    <div class="hero__ctas" data-reveal></div>
  </div>

  <div class="hero__scroll" aria-hidden="true">
    <span>Scroll</span><span class="hero__scroll-line"></span>
  </div>
</section>

<!-- ═══════════════════════ MARQUEE ═══════════════════════ -->
<div class="marquee" aria-hidden="true">
  <div class="marquee__track" id="marqueeTrack"></div>
</div>

<!-- ═══════════════════════ MISSION ═══════════════════════ -->
<section class="section section--mission" id="mission">
  <div class="wrap">
    <p class="kicker" data-reveal></p>
    <blockquote class="mission__statement" data-reveal-words></blockquote>
    <ol class="principles" id="principles"></ol>
  </div>
</section>

<!-- ═══════════════════════ NOW ═══════════════════════ -->
<section class="section section--now" id="now">
  <div class="wrap">
    <div class="section__head">
      <div>
        <p class="kicker" data-reveal></p>
        <h2 class="section__title" data-reveal></h2>
      </div>
      <p class="section__meta" data-reveal></p>
    </div>
    <div class="now__grid" id="nowGrid"></div>
  </div>
</section>

<!-- ═══════════════════════ WORK ═══════════════════════ -->
<section class="section section--work" id="work">
  <div class="wrap">
    <div class="section__head">
      <div>
        <p class="kicker" data-reveal></p>
        <h2 class="section__title" data-reveal></h2>
      </div>
      <div class="filters" id="workFilters" role="group" aria-label="Filter projects"></div>
    </div>
    <div class="work__grid" id="workGrid"></div>
  </div>
</section>

<!-- ═══════════════════════ RÉSUMÉ ═══════════════════════ -->
<section class="section section--resume" id="resume">
  <div class="wrap">
    <div class="section__head">
      <div>
        <p class="kicker" data-reveal></p>
        <h2 class="section__title" data-reveal></h2>
      </div>
      <a class="btn btn--ghost" id="resumeDownload" href="#" data-magnetic>Download PDF</a>
    </div>

    <div class="resume__layout">
      <ol class="timeline" id="timeline"></ol>
      <div class="skills" id="skills"></div>
    </div>
  </div>
</section>

<!-- ═══════════════════════ INTERESTS ═══════════════════════ -->
<section class="section section--interests" id="interests">
  <div class="wrap">
    <div class="section__head">
      <div>
        <p class="kicker" data-reveal></p>
        <h2 class="section__title" data-reveal></h2>
      </div>
    </div>
    <div class="bento" id="bento"></div>
  </div>
</section>

<!-- ═══════════════════════ CONTACT ═══════════════════════ -->
<section class="section section--contact" id="contact">
  <div class="wrap contact">
    <p class="kicker" data-reveal></p>
    <h2 class="contact__headline" data-reveal></h2>
    <p class="contact__body" data-reveal></p>

    <a class="contact__mail" id="contactMail" href="#" data-magnetic>
      <span class="contact__mail-text"></span>
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>

    <button class="copy-mail" id="copyMail">
      <span>Or copy the address</span>
      <code></code>
    </button>

    <ul class="socials" id="socials"></ul>
  </div>
</section>

</main>

<footer class="footer">
  <div class="wrap footer__inner">
    <span>© <span id="year"></span> <span id="footerName"></span></span>
    <span class="footer__built">Hand-written HTML, CSS &amp; JS. No framework. <a href="#top">Back to top ↑</a></span>
  </div>
</footer>

<!-- ═══════════════════════ COMMAND PALETTE ═══════════════════════ -->
<div class="palette" id="palette" role="dialog" aria-modal="true" aria-label="Command palette" hidden>
  <div class="palette__scrim" data-close-palette></div>
  <div class="palette__box">
    <div class="palette__input-row">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="paletteInput" type="text" placeholder="Jump to a section, project, or action…" autocomplete="off" spellcheck="false">
      <kbd>esc</kbd>
    </div>
    <ul class="palette__results" id="paletteResults" role="listbox"></ul>
    <div class="palette__foot">
      <span><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
      <span><kbd>↵</kbd> select</span>
      <span><kbd>esc</kbd> close</span>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/data.js"></script>
<script src="js/render.js"></script>
<script src="js/effects.js"></script>
<script src="js/palette.js"></script>
<script src="js/main.js"></script>
</body>
</html>
